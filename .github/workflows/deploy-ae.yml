name: Deploy to safestorage.ae

# Pushes the commit to the EC2 bare repo, whose post-receive hook does the real
# work (release dir -> npm install -> build -> carry static -> smoke test on
# :3101 -> flip `current` -> restart -> verify live -> auto-rollback).
# Nothing is built here, so NO app secrets belong in GitHub: the server reads
# /home/ubuntu/shared/.env.local at build time.

on:
  push:
    branches: [main]
  workflow_dispatch:

# never let two deploys touch the box at once
concurrency:
  group: deploy-ae
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the bare repo rejects shallow pushes

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.AE_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.AE_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=20
        run: |
          set -o pipefail
          git push "ssh://${{ secrets.AE_USER }}@${{ secrets.AE_HOST }}:${{ secrets.AE_SSH_PORT || 22 }}/home/ubuntu/dubai.git" \
            "${{ github.sha }}:refs/heads/main" 2>&1 | tee deploy.log
          # git IGNORES a post-receive hook's exit code, so the push "succeeds"
          # even when the build or the smoke test failed. Gate on the marker.
          if grep -q "==> Deployed" deploy.log; then
            exit 0
          fi
          # Someone pushed this exact commit straight to the box (origin used to
          # carry the EC2 push URL as well). Nothing was received, so no hook ran
          # and there is no marker - but the commit IS on the box. Warn, and let
          # the live check below decide.
          if grep -q "Everything up-to-date" deploy.log; then
            echo "::warning::commit was already on the server (deployed outside CI) - no build ran here"
            exit 0
          fi
          echo "::error::deploy hook did not report success - live site was left on the previous release"
          exit 1

      - name: Verify live site is styled
        run: |
          html=$(curl -sf --retry 6 --retry-delay 5 --retry-all-errors https://safestorage.ae/)
          css=$(printf '%s' "$html" | grep -oE '/_next/static/[^"]+\.css' | head -1)
          [ -n "$css" ] || { echo "::error::homepage references no CSS"; exit 1; }
          curl -sf -o /dev/null "https://safestorage.ae$css" \
            || { echo "::error::CSS $css is not being served"; exit 1; }
          echo "live OK - $css"
