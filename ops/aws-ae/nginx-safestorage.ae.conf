server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.safestorage.ae;

    ssl_certificate /etc/letsencrypt/live/safestorage.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safestorage.ae/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://safestorage.ae$request_uri;
}

server {
    server_name safestorage.ae;

    include /etc/nginx/snippets/blog-legacy-redirects.conf;

    location /blog-images/ {
        root /var/www;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri @blog_images_in;
    }

    location @blog_images_in {
        # 2026-09-02: the upstream MUST be reached through a variable. With a
        # literal hostname nginx resolves it at config-parse time, so a transient
        # DNS outage (apt-daily bouncing systemd-resolved) made "nginx -t" fail
        # and took the WHOLE SITE down -- twice (Aug 27, Sep 02). Via a variable
        # the name is resolved per-request: a DNS blip now 502s this one legacy
        # image path instead of killing the server.
        # 169.254.169.253 is the AWS VPC resolver (always up, independent of
        # systemd-resolved); 127.0.0.53 is the local stub as a second option.
        resolver 169.254.169.253 127.0.0.53 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $blog_in_upstream "safestorage.in";
        proxy_pass https://$blog_in_upstream$blog_in_uri;
        proxy_set_header Host safestorage.in;
        proxy_ssl_server_name on;
    }

    # 2026-09-17: hashed build assets never change, cache them for a year.
    # 2026-09-17: during the few seconds of an app restart show a friendly
    # self-refreshing page instead of a raw 502.
    error_page 502 503 504 = /__ss_updating.html;
    location = /__ss_updating.html {
        internal;
        root /var/www/safestorage-maint;
        try_files /updating.html =503;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
    }

    location /_next/static/ {
        # hide the upstream immutable label; re-add it on success responses only
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 2026-09-17: Next sends pages with only "s-maxage=31536000", which
        # Safari / in-app browsers heuristically cache. After a deploy that
        # cached HTML pointed at deleted CSS chunks and rendered unstyled.
        # Browsers must now revalidate every page (ETag keeps it cheap).
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/safestorage.ae/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/safestorage.ae/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


# Added 2026-08-03: plain HTTP was falling through to the nginx default_server
# ("Welcome to nginx!") for both hostnames. Funnel all HTTP to the canonical apex.
server {
    listen 80;
    listen [::]:80;
    server_name safestorage.ae www.safestorage.ae;
    return 301 https://safestorage.ae$request_uri;
}
